<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cinematic HTML Builder - Live Construction Preview</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #04070e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      overflow: hidden;
    }

    #app-container {
      display: flex;
      flex-direction: column;
      height: 100vh;
      width: 100vw;
    }

    /* Top Navigation Bar */
    header.top-bar {
      height: 52px;
      background: #090e1a;
      border-bottom: 1px solid rgba(0, 240, 255, 0.25);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 20px;
      z-index: 20;
      box-shadow: 0 4px 20px rgba(0,0,0,0.6);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      font-size: 20px;
      filter: drop-shadow(0 0 8px #00f0ff);
    }

    .brand-title {
      font-size: 15px;
      font-weight: 800;
      letter-spacing: 1.5px;
      color: #00f0ff;
      text-transform: uppercase;
      text-shadow: 0 0 10px rgba(0, 240, 255, 0.7);
    }

    .badge-pill {
      font-size: 10px;
      padding: 2px 8px;
      border-radius: 12px;
      background: rgba(0, 240, 255, 0.15);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      font-family: monospace;
      font-weight: 600;
    }

    .header-actions {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-action {
      background: rgba(0, 240, 255, 0.12);
      border: 1px solid rgba(0, 240, 255, 0.4);
      color: #00f0ff;
      padding: 6px 14px;
      font-size: 11px;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-family: monospace;
      transition: all 0.2s;
    }

    .btn-action:hover {
      background: rgba(0, 240, 255, 0.3);
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }

    .btn-action.highlight {
      background: #00f0ff;
      color: #060911;
      border-color: #00f0ff;
      box-shadow: 0 0 15px rgba(0, 240, 255, 0.7);
    }

    /* Main Split View */
    main.split-view {
      display: flex;
      flex: 1;
      height: calc(100vh - 52px);
      overflow: hidden;
      position: relative;
    }

    /* Left: HUD Container */
    #hud-pane {
      width: 380px;
      min-width: 340px;
      height: 100%;
      background: #060911;
      z-index: 15;
    }

    /* Right: Sandboxed Preview Pane */
    #preview-pane {
      flex: 1;
      height: 100%;
      background: #0a0e17;
      position: relative;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    .preview-header-bar {
      height: 32px;
      background: rgba(13, 21, 39, 0.9);
      border-bottom: 1px solid rgba(0, 240, 255, 0.15);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      font-family: monospace;
      font-size: 11px;
      color: #718096;
    }

    .preview-security-badge {
      color: #00ff88;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .security-dot {
      width: 6px;
      height: 6px;
      background: #00ff88;
      border-radius: 50%;
      box-shadow: 0 0 6px #00ff88;
    }

    #sandbox-frame-wrap {
      flex: 1;
      width: 100%;
      height: calc(100% - 32px);
      position: relative;
    }

    #sandbox-frame-wrap iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
    }

    /* Modal / Custom Code Drawer */
    #custom-modal {
      display: none;
      position: fixed;
      top: 60px;
      right: 20px;
      width: 480px;
      background: #090e1a;
      border: 1px solid #00f0ff;
      border-radius: 8px;
      padding: 16px;
      z-index: 100;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8), 0 0 25px rgba(0, 240, 255, 0.3);
    }

    #custom-modal textarea {
      width: 100%;
      height: 200px;
      background: #04070e;
      border: 1px solid rgba(0, 240, 255, 0.3);
      color: #00f0ff;
      font-family: monospace;
      font-size: 11px;
      padding: 8px;
      border-radius: 4px;
      resize: vertical;
      outline: none;
      box-sizing: border-box;
      margin-bottom: 10px;
    }
  </style>
  <link rel="stylesheet" href="../src/monitor/token-monitor.css">
</head>
<body>
  <div id="app-container">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="brand">
        <span class="brand-icon">⚡</span>
        <h1 class="brand-title">Cinematic HTML Builder</h1>
        <span class="badge-pill">STREAM: TOKEN-BY-TOKEN</span>
        <span class="badge-pill">PRESET: HERO POWER-UP</span>
      </div>

      <div class="header-actions">
        <button class="btn-action" id="btn-custom-html">Custom HTML</button>
        <button class="btn-action highlight" id="btn-stream-sample">Start Streaming</button>
      </div>
    </header>

    <!-- Split Screen View -->
    <main class="split-view">
      <!-- High-Tech Token Monitor HUD -->
      <section id="hud-pane"></section>

      <!-- Sandboxed Construction Preview -->
      <section id="preview-pane">
        <div class="preview-header-bar">
          <div class="preview-security-badge">
            <span class="security-dot"></span>
            <span>SANDBOXED IFRAME (sandbox="allow-scripts")</span>
          </div>
          <div id="preview-status-text">STATUS: READY TO STREAM</div>
        </div>
        <div id="sandbox-frame-wrap"></div>
      </section>
    </main>
  </div>

  <!-- Custom HTML Drawer -->
  <div id="custom-modal">
    <div style="display: flex; justify-content: space-between; margin-bottom: 8px;">
      <span style="font-size: 12px; font-weight: bold; color: #00f0ff;">PASTE STREAMING HTML</span>
      <button id="btn-close-modal" style="background: none; border: none; color: #718096; cursor: pointer; font-size: 14px;">✕</button>
    </div>
    <textarea id="custom-html-input" placeholder="Paste your HTML here..."></textarea>
    <button class="btn-action highlight" id="btn-run-custom" style="width: 100%;">STREAM CUSTOM PAYLOAD</button>
  </div>

  <!-- Scripts -->
  <script type="module">
    import { StreamingHTMLParser } from '../src/parser/stream-parser.js';
    import { SandboxedIframeShell } from '../src/sandbox/iframe-shell.js';
    import { TokenMonitorHUD } from '../src/monitor/token-monitor-hud.js';

    // Sample Hero HTML for demonstration
    const SAMPLE_HTML = `<div class="hero-container" style="max-width: 860px; margin: 0 auto; padding: 40px 24px; font-family: system-ui, sans-serif;">
  <header style="text-align: center; margin-bottom: 32px;">
    <div class="badge" style="display: inline-block; padding: 6px 16px; background: rgba(0, 240, 255, 0.15); border: 1px solid #00f0ff; border-radius: 20px; color: #00f0ff; font-size: 12px; font-weight: 700; letter-spacing: 1.5px; text-transform: uppercase; margin-bottom: 16px;">
      ⚡ QUANTUM OVERDRIVE v2.5
    </div>
    <h1 style="font-size: 40px; font-weight: 900; background: linear-gradient(135deg, #ffffff 0%, #00f0ff 60%, #ffd700 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 0 0 14px 0; letter-spacing: -0.5px;">
      Autonomous Kinetic Interface
    </h1>
    <p style="font-size: 16px; color: #94a3b8; max-width: 620px; margin: 0 auto 24px auto; line-height: 1.6;">
      Every element materializes dynamically through continuous neural token streaming. Observe the structure locking into alignment in real time.
    </p>
  </header>

  <div style="position: relative; margin-bottom: 36px; border-radius: 12px; overflow: hidden; border: 1px solid rgba(0, 240, 255, 0.3); background: #070d18; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.6);">
    <img
      src="https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1200&q=80"
      alt="Quantum Energy Field"
      style="width: 100%; height: 240px; object-fit: cover;"
    />
    <div style="position: absolute; bottom: 12px; right: 16px; background: rgba(6, 10, 18, 0.85); border: 1px solid #00f0ff; padding: 4px 10px; border-radius: 4px; font-size: 11px; color: #00f0ff;">
      HOLO-OPTIC LINK: ACTIVE
    </div>
  </div>

  <section style="display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 20px; margin-bottom: 35px;">
    <div class="card" style="background: rgba(13, 21, 39, 0.75); border: 1px solid rgba(0, 240, 255, 0.25); border-radius: 10px; padding: 22px; backdrop-filter: blur(10px);">
      <div style="font-size: 24px; margin-bottom: 10px;">⚡</div>
      <h3 style="font-size: 18px; color: #f8fafc; margin: 0 0 8px 0;">Instantaneous Phase Lock</h3>
      <p style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0;">
        Zero latency buffer synchronization. Incoming tokens convert to DOM mutations without pausing for full payloads.
      </p>
    </div>

    <div class="card" style="background: rgba(13, 21, 39, 0.75); border: 1px solid rgba(255, 215, 0, 0.25); border-radius: 10px; padding: 22px; backdrop-filter: blur(10px);">
      <div style="font-size: 24px; margin-bottom: 10px;">🛡️</div>
      <h3 style="font-size: 18px; color: #f8fafc; margin: 0 0 8px 0;">Isolated Sandboxing</h3>
      <p style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0;">
        Guaranteed execution safety. Restrictive iframe policies preserve host runtime integrity at all times.
      </p>
    </div>

    <div class="card" style="background: rgba(13, 21, 39, 0.75); border: 1px solid rgba(0, 255, 136, 0.25); border-radius: 10px; padding: 22px; backdrop-filter: blur(10px);">
      <div style="font-size: 24px; margin-bottom: 10px;">🌀</div>
      <h3 style="font-size: 18px; color: #f8fafc; margin: 0 0 8px 0;">Dynamic Keyframe Surges</h3>
      <p style="font-size: 13px; color: #94a3b8; line-height: 1.5; margin: 0;">
        Every attribute modification triggers localized electromagnetic pulses that illuminate the evolving interface.
      </p>
    </div>
  </section>

  <footer style="text-align: center; padding: 20px 0; border-top: 1px solid rgba(0, 240, 255, 0.15);">
    <button class="cta-button" style="background: linear-gradient(135deg, #00f0ff 0%, #0099ff 100%); color: #060911; font-weight: 800; font-size: 14px; padding: 12px 28px; border: none; border-radius: 6px; cursor: pointer; letter-spacing: 1px; text-transform: uppercase; box-shadow: 0 0 20px rgba(0, 240, 255, 0.5);">
      ENGAGE POWER GRID
    </button>
  </footer>
</div>`;

    let shell = null;
    let hud = null;
    let parser = null;
    let currentSpeed = 1.0;
    let isPaused = false;
    let streamTimer = null;
    let streamIndex = 0;
    let currentHTML = SAMPLE_HTML;

    // Initialize Sandboxed Iframe Shell
    const frameWrap = document.getElementById('sandbox-frame-wrap');
    shell = new SandboxedIframeShell({
      container: frameWrap,
      preset: 'cinematic'
    });

    // Initialize Token Monitor HUD
    const hudPane = document.getElementById('hud-pane');
    hud = new TokenMonitorHUD({
      container: hudPane,
      preset: 'cinematic',
      onControlAction: (action, val) => {
        if (action === 'pause') {
          isPaused = true;
          updateStatusText('PAUSED');
        } else if (action === 'resume') {
          isPaused = false;
          updateStatusText('STREAMING...');
          scheduleNextToken();
        } else if (action === 'step') {
          stepToken();
        } else if (action === 'replay') {
          restartStream();
        } else if (action === 'preset') {
          shell.getTunnel().setTheme(val);
        } else if (action === 'speed') {
          currentSpeed = val === 'max' ? 999 : parseFloat(val);
        }
      }
    });

    // Initialize Streaming Parser
    function initParser() {
      parser = new StreamingHTMLParser({
        onEvent: (event) => {
          hud.recordMutation(event);
          if (shell.getTunnel()) {
            shell.getTunnel().sendMutation(event);
          }
        }
      });
    }
    initParser();

    function updateStatusText(txt) {
      const el = document.getElementById('preview-status-text');
      if (el) el.textContent = `STATUS: ${txt}`;
    }

    // Token Streaming Simulator
    function startStreaming(html) {
      clearTimeout(streamTimer);
      currentHTML = html || SAMPLE_HTML;
      streamIndex = 0;
      isPaused = false;

      // Reset components
      hud.reset();
      initParser();
      if (shell.getTunnel()) {
        shell.getTunnel().reset();
      }

      updateStatusText('STREAMING LIVE TOKENS...');
      scheduleNextToken();
    }

    function scheduleNextToken() {
      if (isPaused || streamIndex >= currentHTML.length) {
        if (streamIndex >= currentHTML.length) {
          parser.end();
          hud.complete();
          updateStatusText('STREAM COMPLETE - PHASE LOCKED');
        }
        return;
      }

      // Slice token chunk: simulate AI token lengths (between 4 and 18 characters)
      let chunkSize = Math.floor(Math.random() * 14) + 4;
      if (currentSpeed >= 100) chunkSize = 60; // MAX speed

      const chunk = currentHTML.slice(streamIndex, streamIndex + chunkSize);
      streamIndex += chunkSize;

      // Feed into HUD and Parser
      hud.recordChunk(chunk);
      parser.feed(chunk);

      // Determine delay
      let delay = 25 / currentSpeed;
      if (currentSpeed >= 100) delay = 1;

      streamTimer = setTimeout(scheduleNextToken, delay);
    }

    function stepToken() {
      if (streamIndex >= currentHTML.length) return;
      const chunkSize = 8;
      const chunk = currentHTML.slice(streamIndex, streamIndex + chunkSize);
      streamIndex += chunkSize;
      hud.recordChunk(chunk);
      parser.feed(chunk);
      if (streamIndex >= currentHTML.length) {
        parser.end();
        hud.complete();
        updateStatusText('STREAM COMPLETE');
      }
    }

    function restartStream() {
      startStreaming(currentHTML);
    }

    // Header buttons
    document.getElementById('btn-stream-sample').addEventListener('click', () => {
      startStreaming(SAMPLE_HTML);
    });

    // Custom HTML modal
    const customModal = document.getElementById('custom-modal');
    document.getElementById('btn-custom-html').addEventListener('click', () => {
      customModal.style.display = 'block';
      document.getElementById('custom-html-input').value = SAMPLE_HTML;
    });
    document.getElementById('btn-close-modal').addEventListener('click', () => {
      customModal.style.display = 'none';
    });
    document.getElementById('btn-run-custom').addEventListener('click', () => {
      const val = document.getElementById('custom-html-input').value;
      customModal.style.display = 'none';
      startStreaming(val);
    });

    // Auto-start stream after 600ms on load
    setTimeout(() => {
      startStreaming(SAMPLE_HTML);
    }, 600);
  </script>
</body>
</html>
